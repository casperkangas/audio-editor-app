# Gitlab CI file
# Includes four stages: install, lint, test, build.
# First job is manual by design, 
# thus ensuring that the CI is not triggered automatically.
# Test Engineer triggers CI before merging to main branch.
default:
  image: node:latest

stages:
  - install
  - lint
  - test
  - build

cache:
  key:
    files:
      - apps/web/package-lock.json
  paths:
    - apps/web/node_modules/

install:
  stage: install
  script:
    - cd apps/web && npm ci
  when: manual

lint:
  stage: lint
  needs: [install]
  script:
    - cd apps/web && npm run lint

unit-tests:
  stage: test
  needs: [lint]
  script:
    - cd apps/web && npx vitest run tests/unit
  artifacts:
    when: always
    reports:
      junit: apps/web/unit-test-results.xml

contract-tests:
  stage: test
  needs: [lint]
  script:
    - cd apps/web && npx vitest run tests/contract
  artifacts:
    when: always
    reports:
      junit: apps/web/contract-test-results.xml

integration-tests:
  stage: test
  needs: [lint]
  script:
    - cd apps/web && npx vitest run tests/integration
  artifacts:
    when: always
    reports:
      junit: apps/web/integration-test-results.xml

build:
  stage: build
  needs: [unit-tests, contract-tests, integration-tests]
  script:
    - cd apps/web && npm run build
  artifacts:
    paths:
      - apps/web/dist/
    expire_in: 1 week
