default:
  image: node:20

stages:
  - install
  - lint
  - test
  - build

cache:
  key:
    files:
      - apps/web/package-lock.json
  paths:
    - apps/web/node_modules/

install:
  stage: install
  script:
    - cd apps/web && npm ci

lint:
  stage: lint
  needs: [install]
  script:
    - cd apps/web && npm run lint

test:
  stage: test
  needs: [lint]
  script:
    - cd apps/web && npm run test
  artifacts:
    when: always
    reports:
      junit: apps/web/test-results.xml

build:
  stage: build
  needs: [test]
  script:
    - cd apps/web && npm run build
  artifacts:
    paths:
      - apps/web/dist/
    expire_in: 1 week
